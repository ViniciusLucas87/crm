[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
